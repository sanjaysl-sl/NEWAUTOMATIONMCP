# Recharge success: buy the 19-coin pack (Rs 4) via the Cashfree test gateway (SUCCESS)
# and check the coins are credited.
# Recorded manually 6 Nov 2026 (recordings/02_ptr_and_recharge, steps 26-41).
# Run:  .\run.ps1 flows\recharge_coin_pack.yaml -Device <serial> -Phone 78901xxxxx
appId: com.dating.for.all.debug
name: Recharge 19 coins - payment success
tags:
  - recharge
  - payment
---
- startRecording: recharge_coin_pack
- runFlow: subflows/select_qa_env.yaml
- runFlow: subflows/login_or_signup.yaml

# Coin balance before
- copyTextFrom:
    id: "coinAmount"
- evalScript: "${output.coinsBefore = parseInt(maestro.copiedText.replace(/[^0-9]/g, ''))}"
- evalScript: "${console.log('Coins before: ' + output.coinsBefore)}"

- runFlow:
    file: subflows/buy_19_coins.yaml
    env:
      STATUS: "SUCCESS"

- extendedWaitUntil:
    visible: "Payment Successful"
    timeout: 60000
- assertVisible: "19"                  # "Coin credited 19"
- takeScreenshot: recharge_success
- tapOn:
    text: "(?i)okay"
    waitToSettleTimeoutMs: 500

# Coins credited (+19)
- extendedWaitUntil:
    visible:
      id: "coinAmount"
    timeout: 20000
- copyTextFrom:
    id: "coinAmount"
- evalScript: "${output.coinsAfter = parseInt(maestro.copiedText.replace(/[^0-9]/g, ''))}"
- evalScript: "${console.log('Coins after: ' + output.coinsAfter)}"
- assertTrue:
    condition: "${output.coinsAfter >= output.coinsBefore + 19}"
    label: "19 coins credited"
- stopRecording
