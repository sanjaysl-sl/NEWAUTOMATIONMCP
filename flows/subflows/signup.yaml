# New-user signup: Set Profile -> content language -> declaration -> app language.
# Expects output.phone to be set (used for a unique nickname).
appId: com.dating.for.all.debug
---
# --- Set Profile ---
- tapOn:
    id: "nicknameTextField"
    waitToSettleTimeoutMs: 500
- eraseText: 30
- inputText: "qatest${output.phone.slice(-5)}"
- extendedWaitUntil:
    visible: "Perfect!"
    timeout: 15000
- hideKeyboard
- evalScript: "${output.gender = (typeof GENDER !== 'undefined' && GENDER) ? String(GENDER) : 'Boy'}"
- tapOn:
    id: "genderSelector"
    waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    visible: "I am ${output.gender}"
    timeout: 10000
- tapOn:
    text: "I am ${output.gender}"
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: "selectedGenderText"
- tapOn:
    id: "dobSelector"
    waitToSettleTimeoutMs: 500
# Picker defaults to the youngest allowed date (exactly 18 years ago); accept it
- tapOn:
    text: "Done"
    waitToSettleTimeoutMs: 500
- tapOn:
    id: "submitButton"
    waitToSettleTimeoutMs: 500

# --- Content language (UI switches to this language until app language is set) ---
# A location (and possibly other) permission dialog pops up here on a fresh install
- repeat:
    while:
      notVisible: "Select your language"
    times: 6
    commands:
      - runFlow: allow_notifications.yaml
      - extendedWaitUntil:
          visible: "Select your language"
          timeout: 5000
          optional: true
- tapOn:
    text: "Hindi"
    waitToSettleTimeoutMs: 500
- tapOn:
    text: "Save"
    waitToSettleTimeoutMs: 500
# --- Boy: police declaration - tick the checkbox, then जमा करें (Submit) ---
- runFlow:
    when:
      true: ${output.gender == 'Boy'}
    commands:
      - extendedWaitUntil:
          visible:
            id: "checkBoxPoliceDeclaration"
          timeout: 30000
      # The first tap can land before the screen is interactive - retry until the box is checked
      - repeat:
          while:
            notVisible:
              id: "checkBoxPoliceDeclaration"
              checked: true
          times: 5
          commands:
            # The notification permission dialog pops up over this screen too
            - runFlow: allow_notifications.yaml
            - tapOn:
                id: "checkBoxPoliceDeclaration"
                waitToSettleTimeoutMs: 500
                optional: true
            - waitForAnimationToEnd:
                timeout: 1500
      - assertVisible:
          id: "checkBoxPoliceDeclaration"
          checked: true
      - tapOn:
          id: "btnPoliceDeclaration"
          waitToSettleTimeoutMs: 500

# --- Girl: voice verification - hold the mic and read the sentence shown
# ("कुछ कुछ होता है राहुल, तुम नहीं समझोगे"), then "गर्ल टेस्ट सफल" (girl test passed).
# NOTE: the check listens to the phone mic - unattended runs may fail here unless QA
# bypasses voice verification for test numbers.
- runFlow:
    when:
      true: ${output.gender == 'Girl'}
    commands:
      - extendedWaitUntil:
          visible: ".*वेरिफिकेशन.*"
          timeout: 30000
      - takeScreenshot: signup_voice_verification
      - longPressOn:
          point: "87%,86%"             # mic button (recorded at 626,1408 on 720x1640)
      - extendedWaitUntil:
          visible: ".*सफल.*"
          timeout: 60000
      - takeScreenshot: signup_voice_verified

# --- App language: English ---
- extendedWaitUntil:
    visible:
      id: "textAppLanguage"
    timeout: 30000
# The notification permission dialog can pop up over this screen and swallow the taps,
# so retry until the app-language screen is gone.
- repeat:
    while:
      visible:
        id: "textAppLanguage"
    times: 5
    commands:
      - runFlow: allow_notifications.yaml
      - tapOn:
          text: "English"
          optional: true
      - tapOn:
          id: "btnSetAppLanguage"      # "Set App language" (text changes with the selected language)
          waitToSettleTimeoutMs: 500
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
